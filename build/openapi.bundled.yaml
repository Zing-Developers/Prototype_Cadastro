    CrimeSubtypeResponse:
      title: CrimeSubtypeResponse
      type: object
      description: |
        Nó da classificação penal do SIGO, como vem de
        `parametrization/getCrimeType/{self_code}`. O mesmo formato serve o
        **enquadramento** (nível 2, passa-se o código da natureza) e o
        **subtipo de crime** (nível 3, passa-se o código do enquadramento).
        No enquadramento o `description` vem `""` e o `article_legislation` é um
        intervalo de artigos; no subtipo o `description` traz o texto do tipo penal.
      properties:
        id:
          type: string
          format: uuid
          description: Identificador do nó no SIGO.
          example: 6c33a314-a079-4d18-8876-63fdee762960
        code:
          type: string
          description: Sigla do enquadramento ou subtipo.
          example: HS
        name:
          type: string
          description: Designação do enquadramento ou subtipo.
          example: Homicídio simples
        description:
          type:
            - string
            - 'null'
          description: |
            Texto do tipo penal (subtipo — pode ser longo e multilinha). Vem `""` nos enquadramentos.
          example: Quem matar outra pessoa será punido com pena de prisão de 12 a 18 anos.
        self_code:
          type: string
          description: |
            Código do nó pai — a natureza (no enquadramento) ou o enquadramento (no subtipo).
          example: CCV
        article_legislation:
          type:
            - string
            - 'null'
          description: |
            Artigo do Código Penal (subtipo) ou intervalo de artigos (enquadramento).
          example: Artigo 122.º do CP
        article_legislation_conj:
          type:
            - string
            - 'null'
          description: Artigo conjugado, quando aplicável; o SIGO devolve `""` quando não há.
          example: ''
        classification_code:
          type:
            - string
            - 'null'
          description: Código da classificação processual.
          example: CPUB
        classification_description:
          type:
            - string
            - 'null'
          description: Classificação processual do crime.
          example: Crimes Públicos
        active:
          type: boolean
          example: true
    GeographyResponse:
      title: GeographyResponse
      type: object
      description: |
        Elemento geográfico do SIGO. Serve os seis níveis — país, ilha, concelho,
        freguesia, localidade e zona.
      properties:
        code_1:
          type: string
          description: |
            Código principal, o que se envia como `selfId` na chamada ao nível
            seguinte.

            Carrega a hierarquia: cada nível acrescenta um número de ordem ao
            código do pai.

            ```
            238           Cabo Verde
            2387          Santiago
            238704        Praia
            238704001        Nossa Senhora da Graça
            238704001001     Cidade da Praia
            238704001001021  Plateau
            ```

            Os segmentos não têm largura fixa — a ilha ocupa um dígito, menos a
            Santa Luzia que ocupa dois (`23810`). Não tentar separar o código por
            posição; usá-lo inteiro.

            Ao nível do país deriva do indicativo telefónico, com zeros à esquerda
            (`033`) e um dígito extra quando dois países partilham o mesmo
            indicativo (`0011` Canadá, `0012` Estados Unidos).

            Tratar sempre como texto: `0012` não é `12`.
          example: '238'
        code_2:
          type: string
          description: |
            Código ISO alfa-2, ao nível do país. Pode vir com o texto `"null"` ou
            em branco quando a origem não o tem.
          example: CV
        code_3:
          type: string
          description: |
            Código ISO alfa-3, ao nível do país. Pode vir com o texto `"null"` ou
            em branco quando a origem não o tem.
          example: CPV
        nome:
          type: string
          description: Designação, quase sempre em maiúsculas
          example: CABO VERDE
