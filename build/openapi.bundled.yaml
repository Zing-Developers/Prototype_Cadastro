    FichaCadastroPessoaSignal:
      title: FichaCadastroPessoaSignal
      type: object
      description: Conjunto de sinais e características físicas registado para a pessoa
      additionalProperties: false
      required:
        - valid_until
        - height
        - physical_build
        - hair
        - color
        - beard
        - mustache
      properties:
        valid_until:
          type: string
          format: date
          description: Data até à qual este conjunto de sinais é considerado válido
          example: '2027-07-21'
        height:
          type: number
          format: double
          minimum: 0.5
          maximum: 2.5
          description: Altura da pessoa em metros
          example: 1.75
        physical_build:
          type: string
          description: |
            Código do valor de Constituição Física do domínio atributos-fisicos. Fonte: GET /dominios/valores-atributo?selfId=CF
          example: MEDIA
        hair:
          type: string
          description: |
            Código do valor de Cabelo do domínio atributos-fisicos. Fonte: GET /dominios/valores-atributo?selfId=CB
          example: CURTO
        color:
          type: string
          description: |
            Código do valor de tez/cor do domínio atributos-fisicos. Fonte: GET /dominios/valores-atributo
          example: MORENA
        beard:
          type: string
          description: |
            Código do valor de Barba do domínio atributos-fisicos (categoria BB). Fonte: GET /dominios/valores-atributo?selfId=BB
          example: CURTA
        mustache:
          type: string
          description: |
            Código do valor de Bigode do domínio atributos-fisicos (categoria BB). Fonte: GET /dominios/valores-atributo?selfId=BB
          example: AUSENTE
