          schema:
            type: string
        - name: registration_certificate_request_number
          in: query
          description: Filtrar pelo número da solicitação de certificado de cadastro
          schema:
            type: string
        - name: date_of_birth
          in: query
          description: Filtrar pela data de nascimento (yyyy-MM-dd)
          schema:
            type: string
            format: date
        - name: document_number
          in: query
          description: Filtrar pelo número do documento da pessoa
          schema:
            type: string
        - name: document_type
          in: query
          description: Filtrar pelo tipo de documento da pessoa
          schema:
            type: string
        - name: island_id
          in: query
          description: Filtrar pelo identificador da ilha
          schema:
            type: string
        - name: county_id
          in: query
          description: Filtrar pelo identificador do concelho
          schema:
            type: string
        - name: parish_id
          in: query
          description: Filtrar pelo identificador da freguesia
          schema:
            type: string
        - name: locality_id
          in: query
          description: Filtrar pelo identificador da localidade
          schema:
            type: string
        - name: zone_id
          in: query
          description: Filtrar pelo identificador da zona
          schema:
            type: string
        - name: another_point
          in: query
          description: Filtrar por outro ponto de referência do endereço
          schema:
            type: string
        - name: created_at
          in: query
          description: Filtrar pela data de criação (yyyy-MM-dd)
          schema:
            type: string
            format: date
        - name: status_code
          in: query
          description: Filtrar pelo código do estado da solicitação
          schema:
            $ref: '#/components/schemas/RegistrationCertificateStatus'
      responses:
        '200':
          description: Lista paginada de solicitações de certificados de cadastro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistrationCertificateRequestList'
              examples:
                sucesso:
                  summary: Solicitações encontradas
                  value:
                    success: true
                    status: 200
                    status_text: OK
                    data:
                      - id_registration_certificate_request: ccb5d76e-cd46-f4f2-355d-7d1aa9b7ec90
                        registration_certificate_request_number: '000003'
                        full_name: João Silva
                        date_of_birth: '1990-05-14'
                        created_at: '2026-07-28 10:30:00'
                        status_description: Por Pagar
                        status_code: PP
                      - id_registration_certificate_request: 47fb3825-525d-48c4-a81c-89f8620e8042
                        registration_certificate_request_number: '000004'
                        full_name: Maria Lopes
                        date_of_birth: '1988-11-21'
                        created_at: '2026-07-29 09:15:00'
                        status_description: Por Registar
                        status_code: PR
                    pagination:
                      page: 0
                      page_size: 20
                      page_count: 1
                      total: 2
                vazio:
                  summary: Nenhuma solicitação encontrada
                  value:
                    success: true
                    status: 200
                    status_text: OK
                    data: []
                    pagination:
                      page: 0
                      page_size: 20
                      page_count: 0
                      total: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Solicitacoes-Certificado-Cadastro
      summary: Criar uma solicitação de certificado de cadastro
      description: Regista uma nova solicitação de certificado de cadastro.
      operationId: criarSolicitacaoCertificadoCadastro
