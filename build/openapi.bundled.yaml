      properties:
        id:
          type: string
          format: uuid
        self_id:
          type: string
          description: Código do domínio-pai na hierarquia ("0" na raiz)
          example: '0'
        code:
          type: string
          maxLength: 40
          description: Chave estável do domínio
          example: MEDIDAS_APLICADAS
        name:
          type: string
          maxLength: 255
          description: Rótulo do domínio
          example: Medidas Aplicadas
        order:
          type: integer
        status:
          type: boolean
        values:
          type: array
          items:
            $ref: '#/components/schemas/DomainValueResponse'
    DomainValueRequest:
      title: DomainValueRequest
      type: object
      description: |
        Corpo para criar um valor de domínio.

        O `id`, o `is_system`, o `status` e os campos de auditoria são preenchidos
        pelo sistema — o valor é criado sempre com o estado Ativo.
      required:
        - value
        - value_description
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            Sigla do valor. Não é editável depois de criada, por ser a chave
            usada nos registos já gravados.
          example: PP
        value_description:
          type: string
          minLength: 1
          maxLength: 255
          description: Descrição apresentada ao utilizador
          example: Prisão Preventiva
        is_default:
          type: boolean
          default: false
          description: |
            Marca o valor como sugerido por omissão.
            Apenas um valor por domínio o pode ser.
    DomainValueUpdateRequest:
      title: DomainValueUpdateRequest
      type: object
      description: |
        Corpo para atualizar um valor de domínio.

        Só a descrição e a marcação de padrão são editáveis. Nunca são alterados
        o `id`, o `domain_code`, o `domain_name`, o `value`, o `is_system` nem a
        auditoria de criação — a sigla, em particular, é a chave usada nos
        registos já gravados.
      required:
        - value_description
      properties:
        value_description:
          type: string
          minLength: 1
          maxLength: 255
          description: Descrição apresentada ao utilizador
          example: Prisão Preventiva
        is_default:
          type: boolean
          description: |
            Marca o valor como sugerido por omissão.
            Apenas um valor por domínio o pode ser.
          example: true
    DomainValueResponse:
      title: DomainValueResponse
      type: object
      description: Valor de domínio
      properties:
        id:
          type: string
          format: uuid
          description: Identificador do valor
          example: e1a2b3c4-0000-4000-8000-000000000001
        domain_id:
          type: string
          format: uuid
        domain_code:
          type: string
          maxLength: 40
          description: Código do domínio a que o valor pertence
          example: MEDIDAS_APLICADAS
        domain_name:
          type: string
          maxLength: 255
          description: Rótulo do domínio a que o valor pertence
          example: Medidas Aplicadas
        value:
          type: string
          maxLength: 100
          description: Sigla do valor — coluna VALOR do ecrã
          example: PP
        value_description:
          type: string
          maxLength: 255
          description: Texto do valor — coluna DESCRIÇÃO do ecrã
          example: Prisão Preventiva
        is_default:
          type: boolean
        is_system:
          type: boolean
          description: Indica se o valor é protegido (a aplicação depende dele)
        status:
          type: boolean
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        created_by_name:
          type: string
          maxLength: 200
          description: Nome do utilizador que criou o registo
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
        updated_by_name:
          type: string
          maxLength: 200
          description: Nome do utilizador que actualizou o registo
    GroupRequest:
      title: GroupRequest
      type: object
      description: |
        Corpo para criar um grupo no catálogo (`group_param`).

        O `id` e os campos de auditoria são preenchidos pelo sistema, e o grupo
        fica Ativo ao ser criado.
      required:
        - group_id
        - name
      properties:
        group_id:
          type: string
          minLength: 1
          maxLength: 20
          description: |
            Sigla do grupo. Não é editável depois de criada, por preservar as
            referências existentes.
          example: GSA
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Designação do grupo apresentada na listagem
          example: Grupo de Santo Antão
        area_of_operation:
          type: string
          maxLength: 255
          description: Atividade do grupo, em texto livre
          example: Furtos
        island_id:
          type: string
          maxLength: 20
          description: Ilha de atuação, escolhida na referência geográfica
          example: '238'
        county_id:
          type: string
          maxLength: 20
          description: Concelho ou cidade de atuação
          example: '2389'
        parish_id:
          type: string
          maxLength: 20
          description: Freguesia de atuação
          example: '23897'
        locality_id:
          type: string
          maxLength: 20
          description: Localidade de atuação
          example: '2389710'
        zone_id:
          type: string
          maxLength: 20
          description: Zona de atuação
        another_point:
          type: string
          maxLength: 500
          description: Ponto que ajuda a localizar a sede do grupo
          example: Perto do mercado
        address_type:
          type: string
          description: Tipo de morada (RESIDÊNCIA, TRABALHO, etc) — referência ao domínio TIPO_ENDERECO
          example: RESIDÊNCIA
