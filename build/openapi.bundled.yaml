      description: |
        Atualiza o estado de uma reabilitação pendente.
        Para aceitar, informe `status` igual a `A` e `reason` vazio.
        Para rejeitar, informe `status` igual a `R` e o motivo em `reason`.
      operationId: alterarEstadoReabilitacao
      security:
        - keycloakUserAuth:
            - cad_reabilitacao
