components:
  securitySchemes:
    sigoClientCredentials:
      type: oauth2
      description: |
        OAuth2 Client Credentials — usado pelo SIGO (sistema → sistema).
        O SIGO obtém um JWT temporário no Keycloak usando client_id + client_secret.
        O token não tem utilizador humano — tem apenas o scope sigo:write.
      flows:
        clientCredentials:
          tokenUrl: https://autenticacao.zingdevelopers.com/realms/pn-test/protocol/openid-connect/token
          scopes:
            sigo:write: Permite ao SIGO registar pedidos de pré-cadastros
    keycloakUserAuth:
      type: oauth2
      description: |
        OAuth2 Authorization Code — usado pelo frontend (utilizador → sistema).
        O utilizador faz login no Keycloak e o frontend envia o JWT resultante no header Authorization.
      flows:
        authorizationCode:
          authorizationUrl: https://keycloak.zingdevelopers.com/realms/pn-test/protocol/openid-connect/auth
          tokenUrl: https://keycloak.zingdevelopers.com/realms/pn-test/protocol/openid-connect/token
          refreshUrl: https://keycloak.zingdevelopers.com/realms/pn-test/protocol/openid-connect/token
          scopes:
            cad_pre_cadastro: Permite gerir registos de pré-cadastro (ver, registar, editar, adicionar observações e anexos)
            cad_documentos: Permite gerir documentos perdidos (ver, registar, editar, registar levantamento)
            cad_ficha_ver: Permite consultar fichas de identificação individual (apenas leitura)
            cad_ficha_editar: Permite criar e alterar dados da ficha de identificação
            cad_reconhecimento: Permite pesquisa avançada por sinais complementares e biometria
            cad_reabilitacao: Permite processar solicitações de reabilitação e limpeza de histórico
            cert_emissao: Permite emitir certificados de cadastro e antecedentes policiais
            sys_param: Permite gerir domínios, valores, tipos e grupos (administrativo - apenas Admin)
            cadastro:read: Permite consultar fichas de cadastro (obsoleto — sendo gradualmente substituído por permissões específicas por módulo)
            cadastro:write: Permite criar e atualizar fichas de cadastro de pessoa (obsoleto — sendo gradualmente substituído por permissões específicas por módulo)
            ficheiros:read: Permite consultar metadados e conteúdo de ficheiros autorizados
            ficheiros:write: Permite criar e eliminar ficheiros autorizados
            pesquisas:read: Permite realizar pesquisas globais de documentos e geografia
            openid: Informação de identidade do utilizador
            profile: Nome e dados básicos do utilizador
  parameters:
    CadastroId:
      name: id
      in: path
      required: true
      description: ID único do pré-cadastro
      schema:
        type: string
        format: uuid
    AnexoId:
      name: anexoId
      in: path
      required: true
      description: ID do anexo
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Número da página (começa em 0)
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Itens por página
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    DominioId:
      name: id
      in: path
      required: true
      description: ID único do domínio
      schema:
        type: string
    DominioIdPath:
      name: dominioId
      in: path
      required: true
      description: ID único do domínio
      schema:
        type: string
    ValorDominioId:
      name: id
      in: path
      required: true
      description: ID único do valor de domínio
      schema:
        type: string
        format: uuid
    SelfIdDirecao:
      name: selfId
      in: query
      required: true
      description: |
        Código do nível anterior na hierarquia — `DN`, a Direção Nacional da PN.
      schema:
        type: string
      example: DN
    SelfIdComando:
      name: selfId
      in: query
      required: true
      description: |
        Código do comando — ex.: `CRSA`, `CGF`, `CPM`.
      schema:
        type: string
      example: CRSA
    SelfIdNatureza:
      name: selfId
      in: query
      required: true
      description: |
        Código da natureza — ex.: `CPESS`, `CPAT`.
      schema:
        type: string
      example: CPESS
    SelfIdEnquadramento:
      name: selfId
      in: query
      required: true
      description: |
        Código do enquadramento — ex.: `CCV`, `CSEX`.
      schema:
        type: string
      example: CCV
    SelfIdTipoCidadao:
      name: selfId
      in: query
      required: true
      description: |
        Tipo de cidadão — `0` para Nacional, `ER` ou `ENR` para os estrangeiros.
      schema:
        type: string
      example: '0'
    SelfIdAtributoFisico:
      name: selfId
      in: query
      required: true
      description: |
        Código da categoria de atributo físico — ex.: `OL`, `CB`, `BB`, `TT`.
      schema:
        type: string
      example: OL
    SelfIdPais:
      name: selfId
      in: query
      required: true
      description: |
        Código do país — o `code_1` devolvido por `/dominios/geografia/paises`.
      schema:
        type: string
      example: '238'
    SelfIdIlha:
      name: selfId
      in: query
      required: true
      description: |
        Código da ilha — o `code_1` devolvido por `/dominios/geografia/ilhas`.
      schema:
        type: string
      example: '2387'
    SelfIdConcelho:
      name: selfId
      in: query
      required: true
      description: |
        Código do concelho — o `code_1` devolvido por `/dominios/geografia/concelhos`.
      schema:
        type: string
      example: '238704'
    SelfIdFreguesia:
      name: selfId
      in: query
      required: true
      description: |
        Código da freguesia — o `code_1` devolvido por `/dominios/geografia/freguesias`.
      schema:
        type: string
      example: '238704001'
    SelfIdLocalidade:
      name: selfId
      in: query
      required: true
      description: |
        Código da localidade — o `code_1` devolvido por `/dominios/geografia/localidades`.
      schema:
        type: string
      example: '238704001001'
    GrupoId:
      name: id
      in: path
      required: true
      description: ID único do grupo (id_group_param)
      schema:
        type: string
        format: uuid
    ObservacaoId:
      name: observacaoId
      in: path
      required: true
      description: ID único da observacao
      schema:
        type: string
        format: uuid
    DocumentoPerdidoId:
      name: id
      in: path
      required: true
      description: ID único do registo de documento perdido
      schema:
        type: string
        format: uuid
    ReabilitacaoId:
      name: id
      in: path
      required: true
      description: Identificador único da reabilitação
      schema:
        type: string
        format: uuid
    DominioCode:
      name: code
      in: path
      required: true
      description: Código do domínio a que o valor pertence
      schema:
        type: string
        minLength: 1
        maxLength: 40
      example: MEDIDAS_APLICADAS
  schemas:
    CadastroRequest:
      title: CadastroRequest
      type: object
      description: Estrutura de dados enviada pelo SIGO para registar um pré-cadastro
      required:
        - personal_info
        - document_info
        - address_info
        - occurrence_info
      properties:
        personal_info:
          $ref: '#/components/schemas/PersonalInfo'
        document_info:
          $ref: '#/components/schemas/DocumentInfo'
        contacts:
          type: array
          description: Lista de contactos da pessoa (opcional)
          items:
            $ref: '#/components/schemas/Contact'
        address_info:
          $ref: '#/components/schemas/AddressInfo'
        occurrence_info:
          $ref: '#/components/schemas/OccurrenceInfo'
        attachments:
          type: array
          description: Ficheiros anexados ao pré-cadastro (opcional)
          items:
            $ref: '#/components/schemas/Attachment'
    PersonalInfo:
      title: PersonalInfo
      type: object
      description: Dados pessoais e de identificação da pessoa
      required:
        - full_name
        - date_of_birth
        - sex
        - sex_description
        - marital_status
        - marital_status_description
        - place_of_birth
        - place_of_birth_id
        - nationality
        - nationality_id
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 200
          description: Nome completo
        nickname:
          type: string
          maxLength: 100
          description: Alcunha
        date_of_birth:
          type: string
          format: date
          description: Data de nascimento (yyyy-MM-dd)
          example: '1995-03-15'
        sex:
          $ref: '#/components/schemas/Sex'
        sex_description:
          type: string
          description: Descrição do sexo
          example: Masculino
        marital_status:
          $ref: '#/components/schemas/MaritalStatus'
        marital_status_description:
          type: string
          description: Descrição do estado civil
          example: Solteiro(a)
        place_of_birth:
          type: string
          description: Naturalidade (nome)
        place_of_birth_id:
          type: string
          description: Código da naturalidade
        nationality:
          type: string
          description: Nacionalidade (nome)
        nationality_id:
          type: string
          description: Código da nacionalidade
        mother_name:
          type: string
          maxLength: 150
          description: Nome da mãe
        father_name:
          type: string
          maxLength: 150
          description: Nome do pai
        profession:
          type: string
          maxLength: 100
          description: Profissão
        nif:
          type: string
          pattern: ^\d{9}$
          description: Número de Identificação Fiscal (9 dígitos numéricos)
          example: '200123456'
    DocumentInfo:
      title: DocumentInfo
      type: object
      description: Dados do documento de identificação
      required:
        - document_type
        - document_description
        - document_number
      properties:
        document_type:
          type: string
          enum:
            - BI
            - CNI
            - NIF
            - TRE
            - PASS
            - CC
          description: |
            Código do tipo de documento:
            - BI: Bilhete de Identidade
            - CNI: Cartão Nacional de Identificação
            - NIF: Número de Identificação Fiscal
            - TRE: Título de Residência Estrangeiro
            - PASS: Passaporte
            - CC: Carta de Condução
        document_description:
          type: string
          description: Descrição do tipo de documento
          example: Bilhete de Identidade
        document_number:
          type: string
          minLength: 1
          maxLength: 50
          description: Número do documento
        issue_date:
          type: string
          format: date
          description: Data de emissão (yyyy-MM-dd)
          example: '2024-03-15'
        expiration_date:
          type: string
          format: date
          description: Data de validade (yyyy-MM-dd)
          example: '2028-03-31'
        issue_location:
          type: string
          description: Local de emissão
