          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReabilitacaoStatusRequest'
            examples:
              aceitar:
                summary: Aceitar reabilitação
                value:
                  status: A
                  reason: ''
              rejeitar:
                summary: Rejeitar reabilitação
                value:
                  status: R
                  reason: Documentação apresentada está incompleta
      responses:
        '200':
          description: Estado da reabilitação alterado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReabilitacaoAction'
              examples:
                sucesso:
                  summary: Estado alterado
                  value:
                    success: true
                    status: 200
                    status_text: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ReabilitacaoNotFound'
        '409':
          description: Reabilitação já processada ou com estado incompatível (409)
