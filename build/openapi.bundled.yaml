    OccurrenceInfo:
      title: OccurrenceInfo
      type: object
      description: Dados da ocorrência registada no SIGO
      required:
        - occurrence_number
        - occurrence_date_of
        - occurrence_date_until
        - unit
        - unit_description
        - comand
        - comand_code
        - user_create
        - user_sent
        - occurrence_create
        - auto_type
        - auto_type_code
        - registrations_measures
      properties:
        occurrence_number:
          type: string
          description: Número de ocorrência registado no SIGO
        occurrence_date_of:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
          description: Data e hora de início da ocorrência (yyyy-MM-dd HH:mm:ss)
          example: '2025-02-18 19:03:00'
        occurrence_date_until:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
          description: Data e hora de fim da ocorrência (yyyy-MM-dd HH:mm:ss)
          example: '2025-02-18 20:00:00'
        unit:
          type: string
          description: Código da unidade orgânica
          example: EPASA
        unit_description:
          type: string
          description: Descrição da unidade orgânica
          example: Esquadra da Praia
        comand:
          type: string
          description: Descrição do comando
          example: Comando da Praia
        comand_code:
          type: string
          description: Código do comando
          example: CPR
        user_create:
          type: string
          description: Utilizador que criou o registo no SIGO
        user_sent:
          type: string
          description: Utilizador que enviou o pedido
        occurrence_create:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
          description: Data e hora de criação da ocorrência no SIGO (yyyy-MM-dd HH:mm:ss)
          example: '2025-02-18 19:00:00'
        occurrence_update:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
          description: Data e hora da última atualização da ocorrência no SIGO (yyyy-MM-dd HH:mm:ss)
          example: '2025-02-18 19:30:00'
        auto_type:
          type: string
          description: Tipo de auto
        auto_type_code:
          type: string
          description: Código do tipo de auto
        auto_subtype:
          type: string
          description: Descrição do subtipo de auto (só no Auto de Participação)
        auto_subtype_code:
          $ref: '#/components/schemas/AutoSubtype'
        observation:
          type: string
          maxLength: 1000
          description: Observações da ocorrência
        link:
          type: string
          description: Link associado à ocorrência
        detention_date:
          type: string
          format: date
          description: Data da detenção
          example: '2025-02-18'
        registrations_measures:
          type: array
          minItems: 1
          description: Medidas de registo associadas à ocorrência
          items:
            $ref: '#/components/schemas/RegistrationMeasure'
