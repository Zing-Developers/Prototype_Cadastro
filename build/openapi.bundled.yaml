        `multipart/form-data`. A ordem e significativa: `types[i]` descreve
        `files[i]`. Ambos os arrays devem conter pelo menos um elemento e ter o
        mesmo numero de elementos. A API devolve `400 Bad Request` se algum campo
        estiver ausente, algum array estiver vazio, um tipo nao for suportado ou os
        arrays tiverem comprimentos diferentes. A igualdade de comprimentos e
        validada pela API em tempo de execucao.
      properties:
        files:
          type: array
          minItems: 1
          description: |
            Ficheiros a enviar. O ficheiro no indice i esta associado ao tipo de fotografia no indice i no array types.
          items:
            type: string
            format: binary
        types:
          type: array
          minItems: 1
          description: |
            Tipos de fotografia associados aos ficheiros enviados. types[i] descreve files[i]. Este array deve ter o mesmo numero de elementos e a mesma ordem que o array files.
          items:
            type: string
