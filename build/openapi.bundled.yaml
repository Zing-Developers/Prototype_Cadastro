  /fichas-cadastro-pessoas/{id_ficha_cadastro_pessoa}/grupos-fotografias/{id_grupo_fotografias}/fotografias:
    post:
      tags:
        - Ficha-Cadastro-Pessoas-Grupos-Fotografias
      summary: Adicionar fotos a um grupo de fotos
      description: |
        Adiciona uma ou mais fotos a um grupo de fotos do cadastro.
        Envie os arrays multipart repetindo os campos `files` e `types`; a ordem
        e significativa e `types[i]` descreve `files[i]`. Ambos devem conter pelo
        menos um elemento e ter o mesmo numero de elementos. A API devolve `400 Bad
        Request` para campos ausentes, arrays vazios, tipos nao suportados ou
        comprimentos diferentes.
      operationId: adicionarFotosGrupoDoCadastro
      security:
        - keycloakUserAuth:
            - cad_ficha_editar
      parameters:
        - name: id_ficha_cadastro_pessoa
          in: path
          required: true
          description: Identificador unico do cadastro
          schema:
            type: string
            format: uuid
        - name: id_grupo_fotografias
          in: path
          required: true
          description: Identificador unico do grupo de fotos
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistrationPhotoRequest'
            encoding:
              files:
                style: form
                explode: true
              types:
                style: form
                explode: true
      responses:
        '201':
          description: Fotos adicionadas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRegistrationPhotosCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /documentos-perdidos:
    get:
      tags:
        - Documentos-Perdidos
      summary: Listar documentos perdidos
      description: |
        Retorna a lista paginada de registos de documentos perdidos, com filtros opcionais. Ordenada por data de registo (descendente). A pesquisa por `document_number` / `full_name` serve também o preenchimento automático do formulário de registo.
      operationId: listarDocumentosPerdidos
      security:
        - keycloakUserAuth:
            - cad_documentos
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: document_type
          in: query
          description: Filtrar por tipo de documento
          schema:
            $ref: '#/components/schemas/DocumentType'
        - name: document_number
          in: query
          description: Filtrar por número do documento
          schema:
            type: string
        - name: full_name
          in: query
          description: Filtrar por nome completo do titular
          schema:
            type: string
        - name: date_of_birth
          in: query
          description: Filtrar por data de nascimento (yyyy-MM-dd)
          schema:
            type: string
            format: date
        - name: island_id
          in: query
          description: Filtrar por ilha
          schema:
            type: string
        - name: unit_id
          in: query
          description: Filtrar por unidade orgânica
          schema:
            type: string
      responses:
