            - string
            - 'null'
        parish_id:
          type:
            - string
            - 'null'
          maxLength: 20
        locality:
          type:
            - string
            - 'null'
        locality_id:
          type:
            - string
            - 'null'
          maxLength: 20
        zone:
          type:
            - string
            - 'null'
        zone_id:
          type:
            - string
            - 'null'
          maxLength: 20
        another_point:
